            "name": "¿Cuánto dura la sesión?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Una sesión de recién nacido puede durar entre dos y tres horas. Suena mucho, pero la mayor parte del tiempo es darle de comer, cambiarlo y esperar a que se acomode. La foto en sí toma segundos. Ven sin prisa."
            }
          },
          {
            "@type": "Question",
            "name": "¿Qué tengo que llevar?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Nada. Yo tengo las envolturas, los gorritos, las canastas y los accesorios. Si hay algo con valor sentimental que quieras incluir — una manta de la abuela, un juguete — tráelo y lo integramos."
            }
          },
          {
            "@type": "Question",
            "name": "¿Cómo preparo al bebé?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Dale de comer completo justo antes de salir de casa. Un bebé lleno y con sueño hace que todo salga mejor. Si usa chupón, tráelo aunque no lo use mucho, ayuda a que se acomode."
            }
          },
          {
            "@type": "Question",
            "name": "¿Qué nos ponemos si vamos a salir en las fotos?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ropa lisa en tonos neutros: crema, beige, gris o blanco. Sin logos ni estampados grandes. La idea es que la atención quede en el bebé y no en la ropa."
            }
          },
          {
            "@type": "Question",
            "name": "¿Pueden venir los hermanitos?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Claro. Las fotos con hermanitos las hacemos al principio, mientras todavía traen paciencia, y después alguien se los puede llevar. La sesión completa es larga para un niño chiquito."
            }
          },
          {
            "@type": "Question",
            "name": "¿Qué pasa si el bebé nace antes o después de la fecha?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No hay problema, casi nunca nacen el día que dijeron. Aparto la semana aproximada y ajustamos el día exacto cuando nazca. Avísame en cuanto llegue y acomodamos."
            }
          },

            "@type": "Question",
